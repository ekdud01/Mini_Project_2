# ==========================================================
# KDSQ 인지선별검사 플랫폼 - 공통 설정 (Entity 설계서 14.1)
# 비밀번호·비밀키는 환경 변수로 덮어쓸 수 있다: ${환경변수:기본값}
# 개인 설정은 application-local.properties에 두고 GitHub에 올리지 않는다.
# ==========================================================
spring.application.name=kdsq

# ── 서버 ──────────────────────────────────────────────
server.port=8080

# ── DB (MariaDB) ─────────────────────────────────────
spring.datasource.url=jdbc:mariadb://localhost:3306/kdsq_db
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ── JPA ──────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
spring.jpa.open-in-view=false

# ── 초기 데이터 (data.sql, Entity 설계서 12.2) ────────
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# ── Thymeleaf (개발 중 새로고침 반영) ─────────────────
spring.thymeleaf.cache=false

# ── JWT (REST API 설계서 3.3) ────────────────────────
app.jwt.secret=${JWT_SECRET:local-dev-secret-key-must-be-at-least-32-bytes}
app.jwt.access-token-validity-seconds=3600
app.jwt.refresh-token-validity-seconds=604800

# ── 관리자 계정 (Entity 설계서 12.1) ─────────────────
app.admin.email=${ADMIN_EMAIL:admin@kdsq.com}
app.admin.password=${ADMIN_PASSWORD:admin1234!}

# ── 개인 설정 파일 (있으면 읽고, 없으면 무시) ─────────
spring.config.import=optional:classpath:application-local.properties
