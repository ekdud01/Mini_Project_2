<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-layout}">
<!-- [임시] 레이아웃 동작 확인용 페이지. 관리자 화면이 완성되면 이 파일과 WebConfig의 /admin/preview를 삭제한다. -->
<head>
    <title>레이아웃 확인</title>
</head>
<body>
<div layout:fragment="content">
    <div class="card">
        <h1>레이아웃 확인용 화면</h1>
        <button class="btn btn-primary">저장</button><button class="btn">취소</button><button class="btn btn-danger">삭제</button>
        <p><span class="badge badge-normal">정상</span> <span class="badge badge-caution">주의</span> <span class="badge badge-high">위험</span></p>
    </div>
</div>
</body>
</html>
