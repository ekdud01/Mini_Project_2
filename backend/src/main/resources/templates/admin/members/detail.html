<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-layout}">
<!-- ADM-04 회원 상세 (UI 4.4) | GET /admin/members/{id}
     Model: member(회원정보), results(검사 이력 List) -->
<head><title>회원 상세</title></head>
<body>
<section layout:fragment="content">

    <div class="page-title">
        <h1>회원 상세</h1>
        <div class="page-actions">
            <a th:href="@{/admin/members/{id}/edit(id=${member.id})}" class="btn">수정</a>
            <!-- 탈퇴 처리: POST 폼 + 확인창, 이미 탈퇴한 회원은 버튼 숨김 (UI 4.4.3) -->
            <form th:unless="${member.status.name() == 'WITHDRAWN'}"
                  th:action="@{/admin/members/{id}/withdraw(id=${member.id})}" method="post">
                <button type="submit" class="btn btn-danger"
                        data-confirm="이 회원을 탈퇴 처리하시겠습니까? 해당 계정으로 더 이상 로그인할 수 없습니다.">탈퇴 처리</button>
            </form>
        </div>
    </div>

    <div class="card">
        <dl class="detail-list">
            <dt>이름</dt>     <dd th:text="${member.name}">홍길동</dd>
            <dt>이메일</dt>   <dd th:text="${member.email}">hong@example.com</dd>
            <dt>성별</dt>     <dd th:text="${member.gender.description}">남성</dd>
            <dt>출생년도</dt> <dd th:text="${member.birthYear}">1960</dd>
            <dt>가입일</dt>   <dd th:text="${#temporals.format(member.createdAt, 'yyyy-MM-dd')}">2026-01-10</dd>
            <dt>상태</dt>
            <dd><span class="badge" th:classappend="'badge-' + ${member.status.name()}"
                      th:text="${member.status.displayName}">활성</span></dd>
        </dl>
    </div>

    <div class="card">
        <h2>검사 이력 <span class="text-sub">(총 <span th:text="${#lists.size(results)}">3</span>건)</span></h2>
        <div class="table-wrap">
            <table class="table">
                <caption class="sr-only">검사 이력</caption>
                <thead>
                <tr>
                    <th scope="col">날짜</th>
                    <th scope="col">KDSQ-P</th>
                    <th scope="col">KDSQ-C</th>
                    <th scope="col">상세</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(results)}">
                    <td colspan="4" class="empty-message">검사 이력이 없습니다.</td>
                </tr>
                <tr th:each="r : ${results}">
                    <td th:text="${#temporals.format(r.createdAt, 'yyyy-MM-dd')}">2026-09-22</td>
                    <td th:text="|${r.firstScore}점/${r.examType.name() == 'KDSQ_C' ? '2차대상' : '정상'}|">4점/2차대상</td>
                    <td th:text="${r.totalScore == null} ? '-' : |${r.totalScore}점/${r.riskLevel.displayName}|">5점/주의</td>
                    <!-- returnUrl: 결과 상세의 [목록] 버튼이 이 회원 상세로 돌아오게 함 -->
                    <td><a th:href="@{/admin/results/{id}(id=${r.id}, returnUrl=${@pageUrl.current()})}" class="btn btn-sm">보기</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</section>
</body>
</html>
