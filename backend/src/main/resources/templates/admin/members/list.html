<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-layout}">
<!-- ADM-03 회원 관리 목록 (UI 4.3) | GET /admin/members?keyword=&status=&page=
     Model: members(Page), keyword(String 또는 null), status(UserStatus enum 또는 null = 전체)
     상태 표기: WITHDRAWN → "비활성" (템플릿에서 변환, 백엔드 수정 없음) -->
<head><title>회원 관리</title></head>
<body>
<section layout:fragment="content"
         th:with="hasKeyword=${keyword != null and !#strings.isEmpty(keyword)},
                  st=${status != null} ? ${status.name()} : '',
                  hasFilter=${hasKeyword or status != null}">

  <div class="page-title"><h1>회원 관리</h1></div>

  <!-- 검색: page는 넣지 않는다 (조건이 바뀌면 첫 페이지부터) -->
  <div class="card">
    <form class="search-form" th:action="@{/admin/members}" method="get" role="search">
      <div class="form-group">
        <label for="keyword">성명/이메일</label>
        <input type="search" id="keyword" name="keyword" class="form-control search-keyword"
               th:value="${keyword}" placeholder="성명 또는 이메일">
      </div>
      <!-- 상태 필터: status는 enum이므로 st(글자)로 바꿔 비교. 전체 = 빈 값 → 서버에서 null
           선택 색: 활성 = 초록, 비활성 = 빨강 (표의 상태 배지와 같은 색) -->
      <fieldset class="form-group">
        <legend>회원 상태</legend>
        <div class="chip-group">
          <label class="chip-check"><input type="radio" name="status" value=""
                                           th:checked="${st == ''}"><span>전체</span></label>
          <label class="chip-check"><input type="radio" name="status" value="ACTIVE"
                                           th:checked="${st == 'ACTIVE'}"><span>활성</span></label>
          <label class="chip-check"><input type="radio" name="status" value="WITHDRAWN"
                                           th:checked="${st == 'WITHDRAWN'}"><span>비활성</span></label>
        </div>
      </fieldset>
      <button type="submit" class="btn btn-primary btn-control" data-loading-text="검색 중">검색</button>
      <a th:href="@{/admin/members}" class="btn btn-control">초기화</a>
    </form>
  </div>

  <div class="card card-flush">
    <div class="card-head">
      <!-- 검색어·상태 필터가 있으면 무엇으로 검색했는지 함께 표시 -->
      <p class="list-summary" th:if="${hasFilter}">
        <th:block th:if="${hasKeyword}">"<strong th:text="${keyword}">홍</strong>"</th:block>
        <th:block th:if="${st != ''}" th:text="${st == 'WITHDRAWN'} ? ' 비활성 회원' : ' 활성 회원'"> 활성 회원</th:block>
        검색 결과 <strong th:text="|${members.totalElements}명|">1명</strong>
      </p>
      <p class="list-summary" th:unless="${hasFilter}">
        총 <strong th:text="|${members.totalElements}명|">24명</strong>
      </p>
      <span class="text-sub">가입일 최신순</span>
    </div>

    <!-- 결과 없음: 표 머리글 대신 안내 + 초기화 -->
    <div class="empty-state" th:if="${members.empty}">
      <strong>검색 결과가 없습니다</strong>
      <a th:if="${hasFilter}" th:href="@{/admin/members}" class="btn btn-sm">검색 초기화</a>
    </div>

    <div class="table-wrap" th:unless="${members.empty}">
      <!-- 이메일 열만 왼쪽 정렬, 나머지는 가운데 정렬 -->
      <table class="table table-center">
        <caption class="sr-only">회원 목록</caption>
        <thead>
          <tr>
            <th scope="col">성명</th>
            <th scope="col" class="text-left">이메일</th>
            <th scope="col">성별</th>
            <th scope="col" class="num">출생년도</th>
            <th scope="col">가입일</th>
            <th scope="col" class="center">상태</th>
            <th scope="col" class="center">상세</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="m : ${members.content}"
              th:with="inactive=${m.status.name() == 'WITHDRAWN'}">
            <!-- 성명을 눌러도 상세로 이동. th:utext는 @highlight.mark 결과에만 사용 -->
              <td><a class="link-name" th:href="@{/admin/members/{id}(id=${m.id})}"
                     th:with="h=${@highlight.mark(m.name, keyword)}" th:utext="${h}">홍길동</a></td>
              <td class="muted text-left" th:with="h=${@highlight.mark(m.email, keyword)}" th:utext="${h}">hong@example.com</td>
              <td th:text="${m.gender.description}">남성</td>
            <td class="num" th:text="${m.birthYear}">1960</td>
            <td th:text="${#temporals.format(m.createdAt, 'yyyy-MM-dd')}">2026-01-10</td>
            <td class="center">
              <span class="badge" th:classappend="'badge-' + ${m.status.name()}"
                    th:text="${inactive} ? '비활성' : '활성'">활성</span>
            </td>
            <td class="center">
              <a th:href="@{/admin/members/{id}(id=${m.id})}" class="btn btn-sm"
                 th:attr="aria-label=|${m.name} 상세 보기|">보기</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div th:replace="~{fragments/pagination :: pagination(${members})}"></div>
</section>
</body>
</html>
