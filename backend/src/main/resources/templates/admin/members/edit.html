<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-layout}">
<!-- ADM-04-1 회원 정보 수정 (UI 4.5) | GET·POST /admin/members/{id}/edit
     Model: form(name, email, gender, birthYear), memberId, member(이름·가입일·상태 표시용)
     검증: @Valid + BindingResult → 입력칸 아래 th:errors, 상단 오류 요약 -->
<head><title>회원 정보 수정</title></head>
<body>
<section layout:fragment="content"
         th:with="inactive=${member.status.name() == 'WITHDRAWN'},
                  thisYear=${#dates.year(#dates.createNow())}">

  <div class="page-title">
    <div class="title-group">
      <h1>회원 정보 수정</h1>
      <span class="text-sub" th:text="|· ${member.name}|">· 홍길동</span>
    </div>
  </div>

  <form class="form-card" th:action="@{/admin/members/{id}/edit(id=${memberId})}"
        th:object="${form}" method="post" novalidate>

    <!-- 오류 요약: 긴 폼에서도 오류를 놓치지 않게 -->
    <div th:if="${#fields.hasErrors('*')}" class="alert alert-error" role="alert">
      <svg th:replace="~{fragments/icons :: alert}"></svg>
      <span th:text="|입력값을 확인해주세요. 오류가 ${#lists.size(#fields.errors('*'))}건 있습니다|">입력값을 확인해주세요. 오류가 3건 있습니다</span>
    </div>
    <!-- 특정 입력칸이 아닌 오류 (서버 오류 등) -->
    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-error" role="alert">
      <svg th:replace="~{fragments/icons :: alert}"></svg>
      <span th:each="err : ${#fields.globalErrors()}" th:text="${err}">처리 중 오류가 발생했습니다</span>
    </div>

    <div class="card">
      <div class="grid-2">
        <div class="form-group">
          <label for="name">이름 <span class="required" aria-hidden="true">*</span></label>
          <input type="text" id="name" th:field="*{name}" class="form-control" th:errorclass="is-invalid"
                 aria-required="true"
                 th:attr="aria-invalid=${#fields.hasErrors('name')} ? 'true' : null,
                          aria-describedby=${#fields.hasErrors('name')} ? 'name-error' : null">
          <p id="name-error" class="field-error" th:if="${#fields.hasErrors('name')}">
            <svg th:replace="~{fragments/icons :: alert}"></svg><span th:errors="*{name}">이름을 입력해주세요</span>
          </p>
        </div>

        <div class="form-group">
          <label for="email">이메일 <span class="required" aria-hidden="true">*</span></label>
          <input type="email" id="email" th:field="*{email}" class="form-control" th:errorclass="is-invalid"
                 aria-required="true" autocomplete="off"
                 th:attr="aria-invalid=${#fields.hasErrors('email')} ? 'true' : null,
                          aria-describedby=${#fields.hasErrors('email')} ? 'email-error' : null">
          <p id="email-error" class="field-error" th:if="${#fields.hasErrors('email')}">
            <svg th:replace="~{fragments/icons :: alert}"></svg><span th:errors="*{email}">이미 사용 중인 이메일입니다</span>
          </p>
        </div>

        <fieldset class="form-group">
          <legend>성별 <span class="required" aria-hidden="true">*</span></legend>
          <div class="radio-group">
            <label class="radio-card"><input type="radio" th:field="*{gender}" value="MALE"><span>남성</span></label>
            <label class="radio-card"><input type="radio" th:field="*{gender}" value="FEMALE"><span>여성</span></label>
          </div>
          <p class="field-error" th:if="${#fields.hasErrors('gender')}">
            <svg th:replace="~{fragments/icons :: alert}"></svg><span th:errors="*{gender}">성별을 선택해주세요</span>
          </p>
        </fieldset>

        <div class="form-group">
          <label for="birthYear">출생년도 <span class="required" aria-hidden="true">*</span>
            <span class="form-hint" th:text="|(1900~${thisYear})|">(1900~2026)</span></label>
          <input type="number" id="birthYear" th:field="*{birthYear}" class="form-control" th:errorclass="is-invalid"
                 aria-required="true" min="1900" th:max="${thisYear}"
                 th:attr="aria-invalid=${#fields.hasErrors('birthYear')} ? 'true' : null,
                          aria-describedby=${#fields.hasErrors('birthYear')} ? 'birthYear-error' : null">
          <p id="birthYear-error" class="field-error" th:if="${#fields.hasErrors('birthYear')}">
            <svg th:replace="~{fragments/icons :: alert}"></svg><span th:errors="*{birthYear}">출생년도를 확인해주세요</span>
          </p>
        </div>
      </div>

      <!-- 수정할 수 없는 정보 -->
      <dl class="readonly-box">
        <div><dt>가입일</dt>
             <dd th:text="|${#temporals.format(member.createdAt, 'yyyy-MM-dd')} (수정 불가)|">2026-03-02 (수정 불가)</dd></div>
        <div><dt>상태</dt>
             <dd><span class="badge" th:classappend="'badge-' + ${member.status.name()}"
                       th:text="${inactive} ? '비활성' : '활성'">활성</span>
                 <span class="text-sub">(비활성 처리는 상세 화면에서)</span></dd></div>
      </dl>

      <div class="form-foot">
        <span class="form-note"><span class="required" aria-hidden="true">*</span> 필수 입력 항목</span>
        <div class="page-actions">
          <a th:href="@{/admin/members/{id}(id=${memberId})}" class="btn">취소</a>
          <button type="submit" class="btn btn-primary" data-loading-text="저장 중...">저장</button>
        </div>
      </div>
    </div>
  </form>

</section>
</body>
</html>
