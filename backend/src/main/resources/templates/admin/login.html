<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!-- ADM-01 관리자 로그인 | 레이아웃 미사용 | 파라미터: ?error, ?logout -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인 | KDSQ 관리자</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="login-page">
<main class="login-box">
    <h1>KDSQ 관리자</h1>

    <div th:if="${param.error}" class="flash flash-error" role="alert">
        이메일 또는 비밀번호가 올바르지 않습니다.
    </div>
    <div th:if="${param.logout}" class="flash flash-success" role="alert">
        로그아웃되었습니다.
    </div>

    <form th:action="@{/admin/login}" method="post">
        <div class="form-group">
            <label for="email">이메일</label>
            <input type="email" id="email" name="email" class="form-control" required autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" class="form-control" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">로그인</button>
    </form>

    <p class="form-note login-note">
        사전 등록된 관리자 계정만 사용할 수 있습니다.<br>
        계정 발급은 시스템 담당자에게 문의하세요.
    </p>
</main>
</body>
</html>
