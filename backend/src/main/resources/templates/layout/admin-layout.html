<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<!-- 관리자 공통 레이아웃 | 각 화면: layout:decorate="~{layout/admin-layout}" -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE | KDSQ 관리자">KDSQ 관리자</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<div class="admin-body">
    <nav th:replace="~{fragments/sidebar :: sidebar}"></nav>
    <main class="admin-main">
        <div th:replace="~{fragments/breadcrumb :: breadcrumb}"></div>
        <div th:replace="~{fragments/flash :: flash}"></div>
        <div layout:fragment="content">본문 영역</div>
    </main>
</div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
<script th:src="@{/js/admin.js}" defer></script>
</body>
</html>
