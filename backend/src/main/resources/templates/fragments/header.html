<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- 공통 헤더 | Model: adminName, currentPath (AdminModelAdvice 제공) -->
<header th:fragment="header" class="admin-header" th:with="p=${currentPath} ?: ''">
    <a th:href="@{/admin/dashboard}" class="admin-logo">KDSQ 관리자</a>
    <nav class="header-menu" aria-label="상단 메뉴">
        <a th:href="@{/admin/dashboard}"
           th:classappend="${#strings.startsWith(p, '/admin/dashboard')} ? 'active'"
           th:attr="aria-current=${#strings.startsWith(p, '/admin/dashboard')} ? 'page' : null">대시보드</a>
        <a th:href="@{/admin/members}"
           th:classappend="${#strings.startsWith(p, '/admin/members')} ? 'active'"
           th:attr="aria-current=${#strings.startsWith(p, '/admin/members')} ? 'page' : null">회원 관리</a>
        <a th:href="@{/admin/results}"
           th:classappend="${#strings.startsWith(p, '/admin/results')} ? 'active'"
           th:attr="aria-current=${#strings.startsWith(p, '/admin/results')} ? 'page' : null">검사 결과</a>
    </nav>
    <div class="admin-user" th:if="${adminName != null}">
        <span><strong th:text="${adminName}">홍길동</strong> 관리자님</span>
        <form th:action="@{/admin/logout}" method="post">
            <button type="submit" class="btn btn-sm">로그아웃</button>
        </form>
    </div>
</header>
</html>
