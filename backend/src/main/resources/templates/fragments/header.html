<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- 공통 헤더 | Model: adminName (AdminModelAdvice 제공, 로그인 시에만 존재) -->
<header th:fragment="header" class="admin-header">
    <a th:href="@{/admin/dashboard}" class="admin-logo">KDSQ 관리자</a>
    <div class="admin-user" th:if="${adminName != null}">
        <span><strong th:text="${adminName}">관리자</strong>님</span>
        <form th:action="@{/admin/logout}" method="post">
            <button type="submit" class="btn btn-sm">로그아웃</button>
        </form>
    </div>
</header>
</html>
