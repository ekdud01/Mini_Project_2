<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- 공통 아이콘 프래그먼트 (lucide 아이콘, ISC 라이선스)
     사용: <svg th:replace="~{fragments/icons :: brain}"></svg>
     - 장식용이므로 aria-hidden="true". 아이콘만 있는 버튼은 버튼에 aria-label을 붙인다
     - 크기·색은 admin.css의 .icon / .icon-sm / .icon-lg, 색은 글자색(currentColor)을 따른다 -->
<body>

<svg th:fragment="brain" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/>
  <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/>
  <path d="M12 5v13"/>
</svg>

<svg th:fragment="mail" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/>
</svg>

<svg th:fragment="lock" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
</svg>

<svg th:fragment="eye" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
</svg>

<svg th:fragment="eye-off" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
  <path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><path d="m2 2 20 20"/>
</svg>

<svg th:fragment="logout" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>
</svg>

<svg th:fragment="shield" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/>
</svg>

<svg th:fragment="pencil" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
</svg>

<svg th:fragment="trash" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
</svg>

<svg th:fragment="search" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
</svg>

<svg th:fragment="info" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
</svg>

<svg th:fragment="alert" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>
</svg>

<svg th:fragment="check" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>
</svg>

<svg th:fragment="clipboard" class="icon icon-lg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <rect x="8" y="2" width="8" height="4" rx="1"/>
  <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
  <path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/>
</svg>

<svg th:fragment="arrow-right" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
</svg>

</body>
</html>
