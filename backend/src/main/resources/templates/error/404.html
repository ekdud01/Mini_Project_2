<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!-- 404 에러 | 없는 URL, 없는 회원·결과 ID | 레이아웃 미사용 단독 페이지 (로그인 전·권한 없음에서도 표시) -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>페이지 없음 | KDSQ 관리자</title>
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="error-page">
  <main class="error-box">
    <span class="brand-mark"><svg th:replace="~{fragments/icons :: brain}"></svg></span>
    <p class="error-code">404</p>
    <h1>요청한 페이지를 찾을 수 없습니다</h1>
    <p>주소가 바뀌었거나<br>삭제된 페이지일 수 있습니다</p>
    <div class="error-actions">
      <button type="button" class="btn" data-action="back">이전 페이지</button>
      <a th:href="@{/admin/dashboard}" class="btn btn-primary">대시보드로 이동</a>
    </div>
  </main>
  <script th:src="@{/js/admin.js}" defer></script>
</body>
</html>
